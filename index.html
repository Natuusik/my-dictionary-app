<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Словарь</title>
    
    <!-- Подключаем локальную библиотеку Supabase, которая теперь загрузится без интернета -->
    <script src="supabase-lib.js"></script>
    
    <link rel="stylesheet" href="style.css">
</head>


<body>
     <!-- ЭКРАН 0: АВТОРИЗАЦИЯ (ВХОД ИЛИ РЕГИСТРАЦИЯ) -->
    <div id="authScreen" class="container" style="max-width: 400px; margin-top: 50px; text-align: center; display: block;">
        <h1>🔐 Личный кабинет</h1>
        <div class="card" style="padding: 20px; background: #f8fafc; border-radius: 8px; border: 1px solid #e2e8f0;">
            <p style="color: #64748b; font-size: 14px; margin-bottom: 15px;">Введите любой логин и пароль. Если аккаунта нет, сначала нажмите "Регистрация"!</p>
            
            <input type="text" id="authUsername" placeholder="Ваш логин (например: natalia)" style="width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 6px; border: 1px solid #cbd5e1; box-sizing: border-box;">
            <input type="password" id="authPassword" placeholder="Ваш пароль" style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 6px; border: 1px solid #cbd5e1; box-sizing: border-box;">
            
            <!-- ДВЕ РАЗДЕЛЬНЫЕ КНОПКИ С НОВЫМИ КОМАНДАМИ -->
            <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                <button onclick="handleLoginOnly()" style="flex: 1; padding: 12px; font-weight: bold; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer;">Войти</button>
                <button onclick="handleRegisterOnly()" style="flex: 1; padding: 12px; font-weight: bold; background: #10b981; color: white; border: none; border-radius: 6px; cursor: pointer;">Регистрация</button>
            </div>
            
            <div id="authError" style="color: #ef4444; font-size: 13px; margin-top: 10px; font-weight: 500;"></div>
        </div>
    </div>

    <!-- ЭКРАН 1: НАСТРОЙКИ, ПАПКИ И СЛОВАРЬ (ГЛАВНЫЙ ЭКРАН) -->
    <div id="mainScreen" style="display: none;">
        
        <!-- Информационная панель пользователя с кнопкой Выйти -->
        <div style="display: flex; justify-content: space-between; align-items: center; background: #f1f5f9; padding: 10px 15px; border-radius: 8px; margin-bottom: 15px;">
            <span id="userInfoText" style="font-weight: bold; color: #334155;">👤 Аккаунт: </span>
            <button onclick="handleLogout()" style="background: #ef4444; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 12px; font-weight: bold;">Выйти</button>
        </div>

        <!-- Полки: Переключатель языков -->
        <div class="lang-tabs">
            <button class="tab-btn active" id="tab-en" onclick="switchLanguage('en')">Английский 🇬🇧</button>
            <button class="tab-btn" id="tab-et" onclick="switchLanguage('et')">Эстонский 🇪🇪</button>
        </div>

        <!-- Карточка настроек аудио-тренировки -->
        <div class="card" style="margin-top: 15px; background: #f8fafc; border-radius: 8px; border: 1px solid #e2e8f0; padding: 20px;">
            <h2 class="section-title" style="margin-top: 0; margin-bottom: 20px;">⚙️ Настройки аудио-тренажёра:</h2>
            
            <div style="margin-bottom: 18px;">
                <label class="field-label" style="font-weight: bold; display: block; margin-bottom: 8px; color: #334155;">Направление тренировки:</label>
                <select id="modeSelectNew" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #cbd5e1; background: white; font-size: 14px;">
                    <option value="foreign-ru">Иностранный ➡️ Русский</option>
                    <option value="ru-foreign">Русский ➡️ Иностранный</option>
                </select>
            </div>
            
            <!-- ПОЛЗУНОК 1: Скорость речи -->
            <div style="margin-bottom: 18px;">
                <label for="speedRangeNew" style="font-size: 14px; font-weight: bold; color: #475569; display: block; margin-bottom: 5px;">🐢 Скорость речи: <span id="speedValue" style="color: #2563eb;">1.0</span>x</label>
                <input type="range" id="speedRangeNew" min="0.5" max="2.0" step="0.1" value="1.0" style="width: 100%; display: block; margin: 0; cursor: pointer;" oninput="document.getElementById('speedValue').innerText = this.value">
            </div>
            
            <!-- ПОЛЗУНОК 2: Перерыв (пауза) между словами -->
            <div style="margin-bottom: 10px;">
                <label for="pauseRangeNew" style="font-size: 14px; font-weight: bold; color: #475569; display: block; margin-bottom: 5px;">⏱️ Время на размышление: <span id="pauseValue" style="color: #2563eb;">3</span> сек</label>
                <input type="range" id="pauseRangeNew" min="1" max="10" step="1" value="3" style="width: 100%; display: block; margin: 0; cursor: pointer;" oninput="document.getElementById('pauseValue').innerText = this.value">
            </div>
        </div>

        <!-- Блок управления темами (папками) -->
        <div class="card" style="margin-top: 15px;">
            <h2 class="section-title">📂 Темы и Папки:</h2>
            <div class="add-box">
                <input type="text" id="newTopicInput" placeholder="Название новой темы (например: Еда)">
                <button class="btn-action" onclick="createTopic()">+ Создать папку</button>
            </div>
            <div id="topicsContainer" class="topics-grid">
                <!-- Сюда JavaScript добавит папки -->
            </div>
        </div>

        <!-- БЛОК СОДЕРЖИМОГО ВЫБРАННОЙ ПАПКИ -->
        <div class="card" id="folderContentBlock" style="display: none; margin-top: 15px;">
            <h2 class="section-title">
                <span id="activeFolderName">Тема не выбрана</span>
                <button class="btn-small-edit" onclick="renameActiveTopic()">✏️</button>
            </h2>

            <!-- Кнопка запуска тренажёра -->
            <button id="btn-toggle-train" onclick="toggleTraining()" style="width: 100%; padding: 12px; font-weight: bold; background: #22c55e; color: white; border: none; border-radius: 6px; cursor: pointer; margin-bottom: 20px; font-size: 16px;">🏋️ Запустить тренажёр для этой папки</button>

            <!-- Форма добавления нового слова -->
            <h3 class="sub-title">➕ Добавить слово в эту папку:</h3>
            <div class="add-word-form">
                <input type="text" id="foreignWordInput" placeholder="Слово на иностранном">
                <input type="text" id="russianWordInput" placeholder="Перевод на русском">
                <button class="btn-action" onclick="addWordToTopic()">Добавить</button>
            </div>
            
            <!-- Список слов внутри папки -->
            <div id="wordsContainer" class="words-list-box" style="margin-top: 15px;">
                <!-- Сюда JavaScript добавит слова -->
            </div>
        </div>
    </div>

    <!-- ЭКРАН 2: АКТИВНЫЙ АУДИО-ТРЕНАЖЁР -->
    <div class="trainer-screen" id="trainerScreen" style="display: none;">
        <div class="current-word" id="wordDisplay">Ожидание...</div>
        <div class="translation-word" id="translationDisplay"></div>
        <div class="audio-type" id="audioTypeDisplay"></div>
        <div class="timer" id="timerDisplay">Пауза 5 секунд...</div>
        <button class="stop" onclick="stopTraining()">⏹ Остановить тренировку</button>
    </div>

    <!-- [ПЕРЕНЕСЕНО СЮДА]: Подключаем скрипт в самом конце body, чтобы все элементы страницы успели загрузиться -->
    <script src="script.js?v=99"></script>
</body>
</html>
